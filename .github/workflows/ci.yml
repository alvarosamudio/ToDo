name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .deb package
        run: |
          docker build -t deepines-todo-builder -f .github/workflows/Dockerfile .
          docker create --name builder deepines-todo-builder
          docker cp builder:/output ./output

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepines-todo-deb
          path: output/*.deb
          retention-days: 7
