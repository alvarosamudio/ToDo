<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#388E3C"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Clipboard body -->
  <rect x="140" y="100" width="232" height="312" rx="20" ry="20" fill="white" opacity="0.95"/>
  <rect x="192" y="72" width="128" height="56" rx="14" ry="14" fill="white" opacity="0.95"/>
  <circle cx="256" cy="100" r="14" fill="url(#bg)"/>

  <!-- Task lines with checkboxes -->
  <!-- Task 1 - checked -->
  <rect x="168" y="164" width="36" height="36" rx="8" ry="8" fill="url(#check)"/>
  <polyline points="176,182 186,192 200,174" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="216" y="172" width="140" height="12" rx="6" ry="6" fill="#1565C0" opacity="0.3"/>

  <!-- Task 2 - checked -->
  <rect x="168" y="220" width="36" height="36" rx="8" ry="8" fill="url(#check)"/>
  <polyline points="176,238 186,248 200,230" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="216" y="228" width="120" height="12" rx="6" ry="6" fill="#1565C0" opacity="0.3"/>

  <!-- Task 3 - unchecked -->
  <rect x="168" y="276" width="36" height="36" rx="8" ry="8" fill="none" stroke="#1565C0" stroke-width="4" opacity="0.5"/>
  <rect x="216" y="284" width="100" height="12" rx="6" ry="6" fill="#1565C0" opacity="0.3"/>

  <!-- Task 4 - unchecked -->
  <rect x="168" y="332" width="36" height="36" rx="8" ry="8" fill="none" stroke="#1565C0" stroke-width="4" opacity="0.5"/>
  <rect x="216" y="340" width="130" height="12" rx="6" ry="6" fill="#1565C0" opacity="0.3"/>

  <!-- Floating checkmark accent -->
  <circle cx="388" cy="380" r="48" fill="url(#check)" opacity="0.9"/>
  <polyline points="368,380 382,394 412,364" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
